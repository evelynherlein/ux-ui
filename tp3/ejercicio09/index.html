<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9 - Flexbox: galería de tarjetas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Catálogo de productos</h1>
    <div class="galeria">
        <div class="producto">
            <img src="producto1.jpg" alt="Mate de calabaza">
            <h3>Mate de calabaza</h3>
            <p class="precio">$8.500</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="producto">
            <img src="producto2.jpg" alt="Bombilla de alpaca">
            <h3>Bombilla de alpaca</h3>
            <p class="precio">$5.200</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="producto">
            <img src="producto3.jpg" alt="Termo de un litro">
            <h3>Termo de un litro</h3>
            <p class="precio">$14.900</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="producto">
            <img src="producto4.jpg" alt="Yerba mate premium">
            <h3>Yerba mate premium</h3>
            <p class="precio">$3.100</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="producto">
            <img src="producto5.jpg" alt="Matera de cuero">
            <h3>Matera de cuero</h3>
            <p class="precio">$11.300</p>
            <button>Agregar al carrito</button>
        </div>
        <div class="producto">
            <img src="producto6.jpg" alt="Set de regalo completo">
            <h3>Set de regalo completo</h3>
            <p class="precio">$22.400</p>
            <button>Agregar al carrito</button>
        </div>
    </div>
</body>
</html>
