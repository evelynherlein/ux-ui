<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 14 - Variables CSS y temas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="pagina">
        <header class="header">
            <h1>Mi sitio con variables CSS</h1>
            <button id="toggle-tema" onclick="document.body.classList.toggle('modo-oscuro')">Cambiar tema</button>
        </header>
        <main class="contenido">
            <p>Este texto usa las variables CSS definidas en <code>:root</code>. Probá el botón de arriba para simular un modo oscuro.</p>
            <button class="boton-primario">Botón primario</button>
        </main>
    </div>
</body>
</html>
